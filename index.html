<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Cheeks — Shared Car Calendar</title>
  <meta name="description" content="Red Cheeks: An open, shared family car booking calendar with custom time slots and conflict protection." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ───── Background Glow Blobs ───── -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- ───── Main App (One-Page Board) ───── -->
  <main id="app">
    <!-- Header -->
    <header id="app-header">
      <div class="header-main">
        <div class="logo-group">
          <div class="logo-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="64" height="64" rx="16" fill="url(#logo-grad)"/>
              <path d="M16 38c0-8 6-18 16-18s16 10 16 18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
              <circle cx="24" cy="40" r="4" fill="#fff" opacity=".85"/>
              <circle cx="40" cy="40" r="4" fill="#fff" opacity=".85"/>
              <path d="M14 36h36" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
              <defs>
                <linearGradient id="logo-grad" x1="0" y1="0" x2="64" y2="64">
                  <stop stop-color="#ff6b6b"/>
                  <stop offset="1" stop-color="#ee5a24"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="header-titles">
            <h1>Red Cheeks</h1>
            <p class="subtitle">Shared Car Schedule & Time Slots</p>
          </div>
        </div>
        <button id="btn-refresh" class="header-icon-btn" title="Refresh Board" aria-label="Refresh Board">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ───── Driver / Name Selection Bar ───── -->
    <section id="driver-bar" aria-label="Who is driving">
      <div class="driver-bar-header">
        <span class="section-label">Who's driving?</span>
        <span id="sync-status" class="sync-badge">
          <span class="sync-dot"></span> Live
        </span>
      </div>

      <div class="driver-input-row">
        <div id="current-avatar" class="driver-avatar" title="Your Color Avatar">?</div>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="driver-name-input" 
            placeholder="Type your name (e.g. Matan)..." 
            maxlength="20" 
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>

      <!-- Quick Switch Driver Chips -->
      <div id="quick-drivers-container" class="quick-drivers-container">
        <span class="quick-label">Recent drivers:</span>
        <div id="quick-drivers-list" class="quick-drivers-list">
          <!-- Populated dynamically via JS -->
        </div>
      </div>
    </section>

    <!-- ───── Month Navigation ───── -->
    <nav id="month-nav" aria-label="Month navigation">
      <button id="btn-prev" class="nav-btn" aria-label="Previous month" title="Previous Month">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M13 4l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 id="month-title">Loading...</h2>
      <button id="btn-next" class="nav-btn" aria-label="Next month" title="Next Month">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-today" class="today-btn">Today</button>
    </nav>

    <!-- ───── Calendar Board ───── -->
    <section id="calendar-wrapper" aria-label="Calendar Board">
      <div id="calendar-weekdays"></div>
      <div id="calendar-grid"></div>
    </section>

    <!-- ───── Dynamic Legend ───── -->
    <section id="legend" aria-label="Board Legend">
      <!-- Generated dynamically based on drivers this month -->
    </section>

    <!-- ───── Board Settings & Tools ───── -->
    <details id="settings-panel">
      <summary>⚙️ My Options</summary>
      <div class="settings-body">
        <button id="btn-clear-my" class="secondary-action-btn">Clear My Bookings</button>
      </div>
    </details>
  </main>

  <!-- ───── Time Slot Day Booking Modal ───── -->
  <div id="day-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-date-title">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 id="modal-date-title">October 31, 2026</h3>
          <p class="modal-subtitle">Schedule & time slots</p>
        </div>
        <button id="btn-modal-close" class="modal-close-btn" aria-label="Close modal">&times;</button>
      </div>

      <!-- Existing Bookings On This Day -->
      <div class="modal-section">
        <div class="section-title-row">
          <span class="modal-section-title">Reserved Times Today</span>
          <span id="modal-slots-count" class="count-pill">0</span>
        </div>
        <div id="modal-existing-slots" class="existing-slots-list">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Add New Time Slot Form -->
      <div class="modal-section book-form-section">
        <span class="modal-section-title">Book a Time Slot</span>
        
        <!-- Preset quick buttons -->
        <div class="preset-buttons">
          <button type="button" class="preset-btn" data-start="08:00" data-end="12:00">Morning (8-12)</button>
          <button type="button" class="preset-btn" data-start="12:00" data-end="17:00">Noon (12-17)</button>
          <button type="button" class="preset-btn" data-start="17:00" data-end="22:00">Evening (17-22)</button>
          <button type="button" class="preset-btn" data-start="08:00" data-end="22:00">All Day</button>
        </div>

        <div class="time-picker-row">
          <div class="time-field">
            <label for="input-start-time">From</label>
            <input type="time" id="input-start-time" value="09:00" step="900" />
          </div>
          <div class="time-separator">→</div>
          <div class="time-field">
            <label for="input-end-time">To</label>
            <input type="time" id="input-end-time" value="13:00" step="900" />
          </div>
        </div>

        <!-- Live Conflict Alert -->
        <div id="modal-conflict-msg" class="conflict-alert hidden">
          ⚠️ Time overlaps with an existing booking
        </div>

        <button id="btn-confirm-slot" class="primary-modal-btn">
          🚗 Reserve as <span id="modal-driver-preview">Driver</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ───── Toast Notifications ───── -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
